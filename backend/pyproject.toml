[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybook-backend"
version = "0.1.0"
description = "Modular Flask backend foundation for MemoryBook."
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.4,<6",
  "Flask>=3.0,<4",
  "Flask-Cors>=5,<6",
  "Flask-JWT-Extended>=4.6,<5",
  "Flask-Limiter>=3.8,<5",
  "Flask-Migrate>=4.0,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "gunicorn>=22,<24",
  "boto3>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "Pillow>=10.4,<12",
  "pypdf>=5.0,<7",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memorybook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
